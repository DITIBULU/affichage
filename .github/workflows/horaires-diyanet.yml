name: Horaires Diyanet

# Chaque lundi, récupère le calendrier officiel Diyanet de Montargis
# et met à jour horaires-officiels.js (utile surtout au passage d'année).
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire les horaires sur Diyanet
        run: python3 outils/maj_horaires_diyanet.py

      - name: Publier si quelque chose a changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Horaires Diyanet mis a jour automatiquement"
          git push
          # relance la publication du site
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
